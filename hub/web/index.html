<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel — Incident Dashboard</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e;
      --blue: #388bfd; --green: #3fb950; --amber: #d29922; --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 32px;
    }
    header { margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 600; }
    h1 .dot {
      display: inline-block; width: 10px; height: 10px;
      background: var(--green); border-radius: 50%; margin-right: 8px;
    }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }

    .filters {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
      margin-bottom: 20px; padding: 14px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px;
    }
    .filters label {
      font-size: 11px; text-transform: uppercase; color: var(--muted);
      display: block; margin-bottom: 4px; letter-spacing: .5px;
    }
    .filters select, .filters input {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 10px; font-size: 14px; min-width: 140px;
    }
    .filters input[type=text] { min-width: 200px; }
    .filters input[type=date] { min-width: 150px; }
    .custom-range { display: none; gap: 12px; }
    .custom-range.show { display: flex; }
    .filters .reset {
      margin-left: auto; align-self: flex-end;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 14px; font-size: 13px; cursor: pointer;
    }
    .filters .reset:hover { color: var(--text); }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 14px; font-size: 12px;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 14px; font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    tr.row { cursor: pointer; }
    tr.row:hover { background: var(--panel); }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
    }
    .sev-WARNING  { background: rgba(210,153,34,.15);  color: var(--amber); }
    .sev-ERROR    { background: rgba(248,81,73,.15);   color: var(--red); }
    .sev-CRITICAL { background: rgba(248,81,73,.25);   color: var(--red); }
    .sev-INFO     { background: rgba(56,139,253,.15);  color: var(--blue); }
    .st-pending_review { color: var(--amber); }
    .st-approved       { color: var(--green); }
    .st-rejected       { color: var(--red); }
    .st-executed       { color: var(--blue); }
    .st-failed         { color: var(--red); }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .count { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <h1><span class="dot"></span>Sentinel</h1>
    <div class="subtitle">Autonomous SRE — Incident Dashboard</div>
  </header>

  <div class="filters">
    <div>
      <label>Severity</label>
      <select id="f-severity">
        <option value="">All</option>
        <option value="SEVERITY_INFO">Info</option>
        <option value="SEVERITY_WARNING">Warning</option>
        <option value="SEVERITY_ERROR">Error</option>
        <option value="SEVERITY_CRITICAL">Critical</option>
      </select>
    </div>
    <div>
      <label>Status</label>
      <select id="f-status">
        <option value="">All</option>
        <option value="pending_review">Pending review</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="executed">Executed</option>
        <option value="failed">Failed</option>
      </select>
    </div>
    <div>
      <label>Source</label>
      <select id="f-source">
        <option value="">All</option>
        <option value="SOURCE_METRICS">Metrics</option>
        <option value="SOURCE_JOURNALD">System logs</option>
        <option value="SOURCE_DOCKER">Docker</option>
      </select>
    </div>
    <div>
      <label>Time window</label>
      <select id="f-since">
        <option value="">All time</option>
        <option value="1h">Last hour</option>
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="custom">Custom range…</option>
      </select>
    </div>
    <div class="custom-range" id="custom-range">
      <div>
        <label>From</label>
        <input id="f-from" type="date">
      </div>
      <div>
        <label>To</label>
        <input id="f-to" type="date">
      </div>
    </div>
    <div>
      <label>Search</label>
      <input id="f-search" type="text" placeholder="Search summary…">
    </div>
    <button class="reset" id="reset">Reset</button>
  </div>

  <div class="count" id="count"></div>

  <table>
    <thead>
      <tr>
        <th>Severity</th>
        <th>Summary</th>
        <th>Status</th>
        <th>Detected</th>
      </tr>
    </thead>
    <tbody id="incident-rows">
      <tr><td colspan="4" class="empty">Loading incidents…</td></tr>
    </tbody>
  </table>

  <script>
    const API = "http://localhost:8080";

    function formatTime(iso) {
      return new Date(iso).toLocaleString();
    }

    function escapeHTML(s) {
      const div = document.createElement("div");
      div.textContent = s == null ? "" : String(s);
      return div.innerHTML;
    }

    // Show/hide the custom date inputs based on the time-window choice.
    function syncCustomRange() {
      const isCustom =
        document.getElementById("f-since").value === "custom";
      document.getElementById("custom-range")
        .classList.toggle("show", isCustom);
    }

    // Build the query string from the current filter controls.
    function currentQuery() {
      const params = new URLSearchParams();
      const sev = document.getElementById("f-severity").value;
      const st  = document.getElementById("f-status").value;
      const src = document.getElementById("f-source").value;
      const since = document.getElementById("f-since").value;
      const search = document.getElementById("f-search").value.trim();

      if (sev)    params.set("severity", sev);
      if (st)     params.set("status", st);
      if (src)    params.set("source", src);
      if (search) params.set("search", search);

      if (since === "custom") {
        const from = document.getElementById("f-from").value;
        const to   = document.getElementById("f-to").value;
        if (from) params.set("from", from);
        if (to)   params.set("to", to);
      } else if (since) {
        params.set("since", since);
      }
      return params.toString();
    }

    async function loadIncidents() {
      const tbody = document.getElementById("incident-rows");
      const count = document.getElementById("count");
      try {
        const qs = currentQuery();
        const res = await fetch(API + "/api/incidents" + (qs ? "?" + qs : ""));
        if (!res.ok) throw new Error("HTTP " + res.status);
        const incidents = await res.json();

        count.textContent = incidents.length + " incident(s)";

        if (!incidents || incidents.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="4" class="empty">No incidents match the filters.</td></tr>';
          return;
        }

        tbody.innerHTML = incidents.map(inc => `
          <tr class="row" onclick="openDetail('${inc.id}')">
            <td><span class="badge sev-${inc.severity.replace('SEVERITY_','')}">
              ${inc.severity.replace('SEVERITY_','')}</span></td>
            <td>${escapeHTML(inc.summary)}</td>
            <td class="st-${inc.status}">${inc.status.replace('_',' ')}</td>
            <td class="mono">${formatTime(inc.detected_at)}</td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML =
          '<tr><td colspan="4" class="empty">Failed to load: ' +
          escapeHTML(String(err)) + '</td></tr>';
      }
    }

    function openDetail(id) {
      window.location.href = "/incident.html?id=" + id;
    }

    // Wire up the dropdown controls.
    ["f-severity","f-status","f-source"].forEach(id => {
      document.getElementById(id).addEventListener("change", loadIncidents);
    });
    // Time window: toggle custom inputs, then reload.
    document.getElementById("f-since").addEventListener("change", () => {
      syncCustomRange();
      loadIncidents();
    });
    ["f-from","f-to"].forEach(id => {
      document.getElementById(id).addEventListener("change", loadIncidents);
    });
    // Search box: reload as the user types (debounced).
    let searchTimer;
    document.getElementById("f-search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadIncidents, 300);
    });
    // Reset clears everything.
    document.getElementById("reset").addEventListener("click", () => {
      ["f-severity","f-status","f-source","f-since"].forEach(
        id => document.getElementById(id).value = "");
      document.getElementById("f-from").value = "";
      document.getElementById("f-to").value = "";
      document.getElementById("f-search").value = "";
      syncCustomRange();
      loadIncidents();
    });

    syncCustomRange();
    loadIncidents();
    setInterval(loadIncidents, 5000);
  </script>
</body>
</html>
