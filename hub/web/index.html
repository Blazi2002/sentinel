<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel — Incident Dashboard</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e;
      --blue: #388bfd; --green: #3fb950; --amber: #d29922; --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 32px;
    }
    header { margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 600; }
    h1 .dot {
      display: inline-block; width: 10px; height: 10px;
      background: var(--green); border-radius: 50%; margin-right: 8px;
    }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 14px; font-size: 12px;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 14px; font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    tr.row { cursor: pointer; }
    tr.row:hover { background: var(--panel); }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 600;
    }
    .sev-WARNING  { background: rgba(210,153,34,.15);  color: var(--amber); }
    .sev-ERROR    { background: rgba(248,81,73,.15);   color: var(--red); }
    .sev-CRITICAL { background: rgba(248,81,73,.25);   color: var(--red); }
    .sev-INFO     { background: rgba(56,139,253,.15);  color: var(--blue); }
    .st-pending_review { color: var(--amber); }
    .st-approved       { color: var(--green); }
    .st-rejected       { color: var(--red); }
    .st-executed       { color: var(--blue); }
    .st-failed         { color: var(--red); }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <header>
    <h1><span class="dot"></span>Sentinel</h1>
    <div class="subtitle">Autonomous SRE — Incident Dashboard</div>
  </header>

  <table>
    <thead>
      <tr>
        <th>Severity</th>
        <th>Summary</th>
        <th>Status</th>
        <th>Detected</th>
      </tr>
    </thead>
    <tbody id="incident-rows">
      <tr><td colspan="4" class="empty">Loading incidents…</td></tr>
    </tbody>
  </table>

  <script>
    const API = "http://localhost:8080";

    // Format an ISO timestamp into a short readable string.
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString();
    }

    // Load incidents from the API and render them as table rows.
    async function loadIncidents() {
      const tbody = document.getElementById("incident-rows");
      try {
        const res = await fetch(API + "/api/incidents");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const incidents = await res.json();

        if (!incidents || incidents.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="4" class="empty">No incidents yet.</td></tr>';
          return;
        }

        tbody.innerHTML = incidents.map(inc => `
          <tr class="row" onclick="openDetail('${inc.id}')">
            <td><span class="badge sev-${inc.severity.replace('SEVERITY_','')}">
              ${inc.severity.replace('SEVERITY_','')}</span></td>
            <td>${escapeHTML(inc.summary)}</td>
            <td class="st-${inc.status}">${inc.status.replace('_',' ')}</td>
            <td class="mono">${formatTime(inc.detected_at)}</td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML =
          '<tr><td colspan="4" class="empty">Failed to load: ' +
          escapeHTML(String(err)) + '</td></tr>';
      }
    }

    // Detail view comes in the next step.
    function openDetail(id) {
      window.location.href = "/incident.html?id=" + id;
    }

    // Escape text so it cannot inject HTML.
    function escapeHTML(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    loadIncidents();
    // Refresh every 5 seconds so new incidents appear automatically.
    setInterval(loadIncidents, 5000);
  </script>
</body>
</html>
